[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-kleio"
version = "1.0.0"
description = "Pygments lexer for Kleio notation (Timelink historical research system)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Joaquim Carvalho and the Time-Link project contributors" },
]
requires-python = ">=3.8"
dependencies = ["pygments>=2.0"]
keywords = ["pygments", "kleio", "timelink", "syntax", "highlighting"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]

[project.entry-points."pygments.lexers"]
kleio = "pygments_kleio:KleioLexer"

[tool.setuptools.packages.find]
where = ["src"]
